

<div class="full">

<div class="container">
  <p class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="header">
    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search by title"
      (input)="searchBooks()"
      (keyup.enter)="searchBooks(true)"
    >

    <button (click)="openAddModal()">Add Book</button>
  </div>

  <table>
    <tr>
      <th>Book ID</th>
      <th>Title</th>
      <th>Author</th>
      <th>Available</th>
      <th>Actions</th>
    </tr>

    <tr *ngFor="let book of books">
      <td>{{ book.bookId }}</td>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>{{ book.availableCopies }}</td>
      <td>
        <button (click)="openEditModal(book)">Edit</button>
        <button (click)="deleteBook(book.bookId)">Delete</button>
      </td>
    </tr>
  </table>
</div>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-card">
    <h3>{{ isEditMode ? 'Update Book Details' : 'Add New Book' }}</h3>

    <input [(ngModel)]="bookForm.isbn" placeholder="Enter ISBN">
    <input [(ngModel)]="bookForm.title" placeholder="Enter book title">
    <input [(ngModel)]="bookForm.author" placeholder="Enter author name">
    <input [(ngModel)]="bookForm.genre" placeholder="Enter genre">
    <input type="number" [(ngModel)]="bookForm.totalCopies" placeholder="Enter total copies">

    <div class="modal-actions">
      <button (click)="saveBook()">Save</button>
      <button (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>
</div>
