spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT signing - set JWT_SECRET in every real environment; a random key is generated
# at startup (and all tokens invalidated on restart) if left unset.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial admin bootstrap - set ADMIN_PASSWORD, otherwise a one-time random
# password is generated and printed to the startup logs.
app.admin.email=${ADMIN_EMAIL:admin@library.com}
app.admin.password=${ADMIN_PASSWORD:}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}